[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-parser"
version = "0.3.0"
description = "Standalone tree parsing utilities"
authors = [{ name="navchetna"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling==2.83.0",
    "sortedcontainers==2.4.0",
    "pdfplumber>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
